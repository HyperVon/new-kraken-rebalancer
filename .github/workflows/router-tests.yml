name: Router Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  router:
    name: Kraken Router (ARR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/router-tests.yml
      - name: Authenticate private ARR install
        env:
          ARR_PRIVATE_PAT: ${{ secrets.ARR_PRIVATE_PAT }}
        run: |
          git config --global \
            "url.https://x-access-token:${ARR_PRIVATE_PAT}@github.com/HyperVon/agent-runtime-router.insteadOf" \
            "https://github.com/HyperVon/agent-runtime-router"
      - name: Install reviewed ARR revision
        run: |
          python3 --version
          python3 -m pip install --disable-pip-version-check \
            "agent-runtime-router @ git+https://github.com/HyperVon/agent-runtime-router.git@ffc927c4424fe42f1266848b42258a5fa7d3bf66"
      - name: Run Kraken ARR adapter and parity tests
        env:
          PYTHONPATH: .agents/runtime-router/adapters/kilo
        run: |
          python3 -m unittest discover \
            -s .agents/runtime-router/adapters/kilo -p "test_*.py" -v
      - name: Verify legacy router is absent and wrappers fail closed without runtime
        run: |
          test ! -e .kilo/model-router
          test ! -e .kilo/model-router/router.py
          test -x route-kilo
          if ./route-kilo --profile routine "router wrapper smoke" 2>&1 | grep -q "ARR runtime is not installed"; then
            echo "Clean checkout fail-closed verified"
          else
            echo "ERROR: wrapper did not fail closed without the target runtime"
            exit 1
          fi
