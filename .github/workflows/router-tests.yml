name: Router Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  router:
    name: Kraken Router (ARR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5a5580b3e72b59f8 # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .kilo/model-router/requirements.txt
      - name: Create venv and install pinned ARR
        run: |
          python3 --version
          bash .kilo/model-router/setup.sh
      - name: Run Kraken router tests via venv
        run: .kilo/model-router/.venv/bin/python -m unittest discover -s .kilo/model-router -p "test_*.py" -v
      - name: Verify wrappers use venv and fail closed without global ARR
        run: |
          # Wrappers must use venv python, not global
          grep -q ".venv/bin/python" .kilo/model-router/route-kilo
          grep -q ".venv/bin/python" .kilo/model-router/route-subagents
          # Simulate clean checkout without global site packages
          .kilo/model-router/.venv/bin/python -c "import agent_runtime_router; print(agent_runtime_router.__version__)"
          # Clean env: wrappers should still work with isolated venv, but fail without venv
          tmp=$(mktemp -d)
          cp -r .kilo/model-router "$tmp/"
          rm -rf "$tmp/model-router/.venv"
          if "$tmp/model-router/route-kilo" --help 2>&1 | grep -q "ARR venv not found"; then
            echo "Clean-checkout fail-closed verified"
          else
            echo "ERROR: wrapper did not fail closed without venv"
            exit 1
          fi
          rm -rf "$tmp"
