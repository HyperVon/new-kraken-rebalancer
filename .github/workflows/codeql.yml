name: "CodeQL Advanced"

# CodeQL Action v4.37.4 is pinned by commit SHA for the Java/Kotlin workflow.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # CodeQL's Kotlin extractor currently supports versions below 2.4.20.
      # Keep the production security patch at 2.4.20-RC and use the latest
      # supported compiler only for this temporary analysis build.
      - name: Use CodeQL-supported Kotlin compiler
        if: matrix.language == 'java-kotlin'
        run: |
          grep -q '^kotlin = "2.4.20-RC"$' gradle/libs.versions.toml
          sed -i 's/^kotlin = "2.4.20-RC"$/kotlin = "2.4.10"/' gradle/libs.versions.toml

      - name: Build Kotlin backend
        if: matrix.language == 'java-kotlin'
        run: |
          chmod +x gradlew
          ./gradlew clean assemble

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:${{matrix.language}}"
