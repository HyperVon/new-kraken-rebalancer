name: "CodeQL Advanced"

# CodeQL Action v4.37.7 is pinned by commit SHA for the Java/Kotlin workflow.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # This SHA-pinned action bundles CodeQL 2.26.3, whose Java/Kotlin pack
      # supports Kotlin through 2.4.10. Keep extraction on that supported compiler
      # and fail closed when the project pin changes so the override is reviewed.
      # https://github.com/github/codeql/blob/codeql-cli/v2.26.3/java/ql/lib/CHANGELOG.md
      - name: Use CodeQL-supported Kotlin compiler
        if: matrix.language == 'java-kotlin'
        run: |
          kotlin_pin=$(sed -nE 's/^kotlin = "([^"]+)"$/\1/p' gradle/libs.versions.toml)
          case "$kotlin_pin" in
            2.4.21)
              sed -i 's/^kotlin = "2\.4\.21"$/kotlin = "2.4.10"/' gradle/libs.versions.toml
              ;;
            2.4.10)
              ;;
            *)
              echo "Unsupported Kotlin pin for CodeQL extraction: '$kotlin_pin'; review the CodeQL support table." >&2
              exit 1
              ;;
          esac

      - name: Build Kotlin backend
        if: matrix.language == 'java-kotlin'
        run: |
          chmod +x gradlew
          ./gradlew clean :codegen:assemble :common:compileKotlinJvm :backend:compileKotlin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{matrix.language}}"
