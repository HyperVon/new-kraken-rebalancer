# Submits the Gradle dependency graph to GitHub's dependency submission API,
# enabling Dependabot security alerts and the dependency graph tab.
# See: https://github.com/gradle/actions/tree/main/dependency-submission

name: Automatic Dependency Submission

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write  # Required to submit the dependency graph

jobs:
  dependency-submission:
    name: Dependency Submission (Gradle)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
