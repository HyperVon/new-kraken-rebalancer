name: Bug Report
description: Report a problem with the rebalancer
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the fields below as thoroughly as possible.
        **Do not include your Kraken API keys or any account credentials.**

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Configure with ...
        2. Start the application
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include any error messages or stack traces (redact sensitive data).
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: What version or git commit SHA are you running?
      placeholder: e.g. main branch, commit abc1234
    validations:
      required: false

  - type: dropdown
    id: mode
    attributes:
      label: Running Mode
      description: Are you running in dry-run or live trading mode?
      options:
        - Dry-run (dryRun: true)
        - Live trading (dryRun: false)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant Configuration
      description: Share relevant settings from your config (redact apiKey and privateKey).
      placeholder: |
        {
          "settings": {
            "loopDelaySeconds": 60,
            ...
          }
        }
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant application logs. Remove any sensitive data.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have removed any API keys or sensitive account data from this report
          required: true
